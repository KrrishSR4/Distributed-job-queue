version: '3.8'

services:
  # Phase 1: Frontend Client
  frontend:
    build:
      context: ./1-client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  # Phase 2 & 4: Go Backend API
  api:
    build:
      context: ./2-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_MODE=api
      - INSTANCE_ID=api-node-1
      - DATABASE_URL=postgres://djq:djqpassword@postgres:5432/djq_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Phase 4: Go Backend Worker Pool
  worker:
    build:
      context: ./2-server
      dockerfile: Dockerfile
    environment:
      - APP_MODE=worker
      - INSTANCE_ID=worker-node
      - DATABASE_URL=postgres://djq:djqpassword@postgres:5432/djq_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - WORKER_COUNT=3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Phase 3: Redis Job Broker & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: djq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 2: PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: djq-postgres
    environment:
      POSTGRES_USER: djq
      POSTGRES_PASSWORD: djqpassword
      POSTGRES_DB: djq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djq -d djq_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
