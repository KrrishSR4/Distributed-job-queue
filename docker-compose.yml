version: '3.8'

services:
  # Phase 1: Frontend Client
  frontend:
    build:
      context: ./1-client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  # Phase 2 & 4: Go Backend API
  api:
    build:
      context: ./2-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_MODE=api
      - APP_ENV=production
      - INSTANCE_ID=api-node-1
      - DATABASE_URL=postgres://djq:djqpassword@postgres:5432/djq_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - djq-network

  # Phase 4: Go Backend Worker Pool
  worker:
    build:
      context: ./2-server
      dockerfile: Dockerfile
    environment:
      - APP_MODE=worker
      - APP_ENV=production
      - INSTANCE_ID=worker-node
      - DATABASE_URL=postgres://djq:djqpassword@postgres:5432/djq_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - WORKER_COUNT=3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - djq-network

  # Phase 3: Redis Job Broker & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: djq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - djq-network

  # Phase 2: PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: djq-postgres
    environment:
      POSTGRES_USER: djq
      POSTGRES_PASSWORD: djqpassword
      POSTGRES_DB: djq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djq -d djq_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - djq-network

  prometheus:
    image: prom/prometheus:latest
    container_name: djq_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./3-infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - djq-network

  loki:
    image: grafana/loki:latest
    container_name: djq_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./3-infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - djq-network

  alloy:
    image: grafana/alloy:latest
    container_name: djq_alloy
    volumes:
      - ./3-infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - djq-network

  grafana:
    image: grafana/grafana:latest
    container_name: djq_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./3-infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./3-infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - djq-network

volumes:
  postgres_data:
  grafana_data:
  loki_data:

networks:
  djq-network:
