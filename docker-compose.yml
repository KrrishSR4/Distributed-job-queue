version: '3.8'

services:
  # Phase 1: Frontend Client
  client:
    build:
      context: ./1-client
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development

  # Phase 2: Go Backend API (Placeholder)
  # server:
  #   build:
  #     context: ./2-server
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
